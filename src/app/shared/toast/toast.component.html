<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none" style="max-width: 360px;">
  <div *ngFor="let toast of toastService.toasts$ | async; trackBy: trackById"
    class="flex items-start gap-3 px-4 py-3 rounded-xl shadow-xl text-sm font-medium pointer-events-auto
           animate-fade-in-down"
    [ngClass]="{
      'bg-white border-l-4 text-gray-800': true,
      'border-green-500': toast.type === 'success',
      'border-red-500':   toast.type === 'error',
      'border-blue-500':  toast.type === 'info'
    }">

    <!-- Icône succès -->
    <svg *ngIf="toast.type === 'success'" class="w-5 h-5 flex-shrink-0 text-green-500 mt-0.5"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>

    <!-- Icône erreur -->
    <svg *ngIf="toast.type === 'error'" class="w-5 h-5 flex-shrink-0 text-red-500 mt-0.5"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>

    <!-- Icône info -->
    <svg *ngIf="toast.type === 'info'" class="w-5 h-5 flex-shrink-0 text-blue-500 mt-0.5"
      fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>

    <span class="flex-1 leading-snug">{{ toast.message }}</span>

    <button (click)="toastService.remove(toast.id)"
      class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
