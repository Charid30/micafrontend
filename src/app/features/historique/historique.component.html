<div class="space-y-6">

  <!-- En-tête -->
  <div class="flex items-center justify-between flex-wrap gap-3">
    <div>
      <h2 class="page-title">Historique &amp; Tendances</h2>
      <p class="text-sm text-gray-500 mt-1">Évolution des indicateurs semaine par semaine</p>
    </div>
  </div>

  <!-- Filtres -->
  <div class="card">
    <div class="flex flex-wrap gap-4 items-end">

      <!-- Module -->
      <div class="flex flex-col gap-1 min-w-48">
        <label class="text-xs font-semibold" style="color:#235347;">Indicateur</label>
        <select [(ngModel)]="moduleKey" (ngModelChange)="onModuleChange()"
          class="input-field text-sm py-1.5 px-3">
          <option *ngFor="let m of modules" [value]="m.key">{{ m.label }}</option>
        </select>
      </div>

      <!-- Période -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold" style="color:#235347;">Période</label>
        <div class="flex gap-1 flex-wrap">
          <button *ngFor="let p of periodes"
            (click)="semaines = p.val; onPeriodeChange()"
            [class]="semaines === p.val
              ? 'px-3 py-1.5 text-xs font-semibold rounded-lg text-white'
              : 'px-3 py-1.5 text-xs font-medium rounded-lg border border-gray-200 text-gray-600 hover:border-green-600'"
            [style.background]="semaines === p.val ? '#235347' : null">
            {{ p.label }}
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Erreur -->
  <div *ngIf="error" class="card border-red-200 bg-red-50 flex items-center gap-3">
    <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <p class="text-sm text-red-700">{{ error }}</p>
  </div>

  <!-- Chargement -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 gap-3">
    <svg class="animate-spin w-8 h-8" style="color: #235347;" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    <p class="text-sm text-gray-400">Chargement des données...</p>
  </div>

  <!-- Graphe -->
  <ng-container *ngIf="!loading && !error">

    <!-- Pas de données -->
    <div *ngIf="!chartData.datasets?.length || !chartData.labels?.length"
      class="card flex flex-col items-center justify-center py-16 gap-3 text-center">
      <svg class="w-12 h-12 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      <p class="text-sm text-gray-400">Aucune donnée disponible pour cette sélection.</p>
      <p class="text-xs text-gray-300">Les données apparaîtront après les premières saisies hebdomadaires.</p>
    </div>

    <!-- Graphe ligne -->
    <div *ngIf="chartData.datasets?.length" class="card">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold" style="color:#0B2B26;">{{ moduleLabel }}</h3>
        <span class="text-xs px-2 py-1 rounded-full font-medium"
          style="background:#DAF1DE; color:#235347;">
          {{ semaines }} semaines
        </span>
      </div>
      <div style="height: 400px; position: relative;">
        <canvas baseChart
          [data]="chartData"
          [options]="chartOptions"
          type="line">
        </canvas>
      </div>
    </div>

  </ng-container>
</div>
